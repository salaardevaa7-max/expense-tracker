# ==========================================================================
#  Builds the Hisaab APK in the cloud, free, on GitHub's servers.
# ==========================================================================
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create . --platforms=android --org com.hisaab --project-name hisaab

      - name: Configure Android permissions & lint settings
        run: python3 setup_android.py

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Prepare artifact
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/hisaab.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hisaab-apk
          path: out/hisaab.apk
          if-no-files-found: error
          retention-days: 90
