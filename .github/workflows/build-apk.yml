# ==========================================================================
#  Builds the Hisaab APK using a robust, production-grade approach.
# ==========================================================================
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Project Scaffolding
        run: flutter create . --platforms=android --org com.hisaab --project-name hisaab

      - name: Add Permissions
        run: |
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_SMS"/>\n    <uses-permission android:name="android.permission.RECEIVE_SMS"/>\n    <uses-permission android:name="android.permission.READ_CONTACTS"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>' android/app/src/main/AndroidManifest.xml

      # Completely turn off Lint by passing flags to Gradle directly
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease -x lint -x lintVitalAnalyzeRelease
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dlint.enabled=false"

      - name: Prepare Artifact
        run: |
          mkdir -p out
          find build/app/outputs/flutter-apk/ -name "app-release.apk" -exec cp {} out/hisaab.apk \;
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} out/hisaab.apk \; 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hisaab-apk
          path: out/
          retention-days: 7
