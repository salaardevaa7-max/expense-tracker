# ==========================================================================
#  Builds the Hisaab APK in the cloud, free, on GitHub's servers.
# ==========================================================================
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android project
        run: |
          flutter create --platforms=android --org com.hisaab --project-name hisaab /tmp/shell
          rm -rf android
          cp -r /tmp/shell/android ./android

      - name: Disable Android Lint to prevent toolchain bugs
        run: |
          echo "android { lint { checkReleaseBuilds false } }" >> android/app/build.gradle

      - name: Add permissions and the app name to the manifest
        run: |
          python3 - <<'PY'
          import re, pathlib

          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          xml = p.read_text()

          perms = [
              'android.permission.READ_SMS',
              'android.permission.RECEIVE_SMS',
              'android.permission.READ_CONTACTS',
              'android.permission.CAMERA',
              'android.permission.READ_MEDIA_IMAGES',
              'android.permission.VIBRATE',
          ]
          block = '\n' + '\n'.join(
              '    <uses-permission android:name="%s"/>' % x for x in perms) + '\n'

          m = re.search(r'<manifest\b[^>]*>', xml)
          if m and 'READ_SMS' not in xml:
              xml = xml[:m.end()] + block + xml[m.end():]

          xml = xml.replace('android:label="hisaab"', 'android:label="Hisaab"')
          p.write_text(xml)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Build the release APK
        run: flutter build apk --release --no-pub

      - name: Rename it something recognisable
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/hisaab.apk
          ls -lh out

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: hisaab-apk
          path: out/hisaab.apk
          if-no-files-found: error
          retention-days: 90
