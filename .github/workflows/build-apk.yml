# ==========================================================================
#  Builds the Hisaab APK in the cloud, free, on GitHub's servers.
# ==========================================================================
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate Android scaffolding.
      - name: Generate Android project
        run: |
          flutter create . --platforms=android --org com.hisaab --project-name hisaab

      # ------------------------------------------------------------------
      #  Disable Lint completely to prevent the toolchain crash.
      #  This is done in the app-level build.gradle, which is more
      #  comprehensive than just `lintOptions` in the android block.
      # ------------------------------------------------------------------
      - name: Add permissions and disable Lint
        run: |
          python3 - <<'PY'
          import re, pathlib

          # 1. Manifest
          manifest_path = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          if manifest_path.exists():
              xml = manifest_path.read_text()
              perms = ['READ_SMS', 'RECEIVE_SMS', 'READ_CONTACTS', 'CAMERA', 'READ_MEDIA_IMAGES', 'VIBRATE']
              for p in perms:
                  perm_tag = f'    <uses-permission android:name="android.permission.{p}"/>'
                  if perm_tag not in xml:
                      xml = xml.replace('<manifest', '<manifest\n' + perm_tag)
              xml = xml.replace('android:label="hisaab"', 'android:label="Hisaab"')
              manifest_path.write_text(xml)

          # 2. Disable Lint
          gradle_path = pathlib.Path('android/app/build.gradle')
          if gradle_path.exists():
              gradle = gradle_path.read_text()
              lint_config = """
android {
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}
"""
              # Append to the end of the file
              with open(gradle_path, 'a') as f:
                  f.write(lint_config)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Build the release APK
        # Use --no-shrink to avoid further complex build optimizations that
        # often trigger toolchain bugs in these environments.
        run: flutter build apk --release --no-shrink

      - name: Rename and upload
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/hisaab.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hisaab-apk
          path: out/hisaab.apk
          if-no-files-found: error
          retention-days: 90
