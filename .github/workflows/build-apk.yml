# ==========================================================================
#  Builds the Hisaab APK in the cloud, free, on GitHub's servers.
#
#  Why this file generates the android/ folder instead of it being checked
#  in: the Android scaffolding (gradle files, manifest, MainActivity) has to
#  match the exact Flutter version doing the building. Hand-written gradle
#  files go stale and fail in ways that are miserable to debug. So we ask
#  the installed Flutter to generate a throwaway project, and borrow its
#  android/ folder. That folder is always correct by construction.
# ==========================================================================
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # lets you press "Run workflow" by hand

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      # Flutter's Android toolchain needs JDK 17.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show the toolchain we ended up with
        run: |
          flutter --version
          java -version

      # ------------------------------------------------------------------
      #  Generate correct Android scaffolding and borrow it.
      #  Done in /tmp so it cannot touch lib/ or pubspec.yaml.
      # ------------------------------------------------------------------
      - name: Generate the Android project
        run: |
          flutter create --platforms=android --org com.hisaab --project-name hisaab /tmp/shell
          rm -rf android
          cp -r /tmp/shell/android ./android

      - name: Add permissions and the app name to the manifest
        run: |
          python3 - <<'PY'
          import re, pathlib

          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          xml = p.read_text()

          perms = [
              'android.permission.READ_SMS',        # auto-capture bank debits
              'android.permission.RECEIVE_SMS',     # catch them as they arrive
              'android.permission.READ_CONTACTS',   # pick people for a split
              'android.permission.CAMERA',          # photograph a receipt
              'android.permission.READ_MEDIA_IMAGES',
              'android.permission.VIBRATE',
          ]
          block = '\n' + '\n'.join(
              '    <uses-permission android:name="%s"/>' % x for x in perms) + '\n'

          # insert straight after the opening <manifest ...> tag
          m = re.search(r'<manifest\b[^>]*>', xml)
          if not m:
              raise SystemExit('could not find the <manifest> tag')
          if 'READ_SMS' not in xml:
              xml = xml[:m.end()] + block + xml[m.end():]

          # the generated label is the lowercase project name
          xml = xml.replace('android:label="hisaab"', 'android:label="Hisaab"')

          p.write_text(xml)
          print(xml[:1400])
          PY

      # ------------------------------------------------------------------
      #  Resolve dependencies. If a constraint in pubspec.yaml cannot be
      #  satisfied against the current Flutter SDK, relax it and retry
      #  rather than failing the whole run over one version number.
      # ------------------------------------------------------------------
      - name: Get packages
        run: |
          flutter pub get || {
            echo "::warning::Initial resolution failed — relaxing constraints and retrying."
            flutter pub upgrade --major-versions
            flutter pub get
          }

      - name: Show what versions were chosen
        run: flutter pub deps --style=compact || true

      # A real compile error should surface here with a readable message,
      # rather than buried a thousand lines into a gradle log.
      - name: Analyse the Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build the release APK
        run: flutter build apk --release

      - name: Rename it something recognisable
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/hisaab.apk
          ls -lh out

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: hisaab-apk
          path: out/hisaab.apk
          if-no-files-found: error
          retention-days: 90
